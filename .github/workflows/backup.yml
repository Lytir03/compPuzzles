name: Encrypted database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA containing the reviewed backup script
        required: true
        type: string
      confirmation:
        description: Type RUN_PRODUCTION_BACKUP exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require trusted main revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production backups may run only from main." >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${REQUESTED_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "commit_sha must be the full SHA of this workflow run." >&2
              exit 1
            fi
            if [[ "${CONFIRMATION}" != "RUN_PRODUCTION_BACKUP" ]]; then
              echo "The production confirmation phrase does not match." >&2
              exit 1
            fi
          fi

  backup:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BACKUP_PREFIX: comppuzzles/database
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out backup script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install backup clients
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          distribution_codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${distribution_codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Stream encrypted backup to private R2
        run: scripts/backup-postgres-to-r2.sh

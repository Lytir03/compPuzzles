name: Apply production database migrations

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA reviewed for production
        required: true
        type: string
      confirmation:
        description: Type APPLY_PRODUCTION_DATABASE exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate requested release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main, exact SHA and explicit confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production migrations may run only from main." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${REQUESTED_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "commit_sha must be the full SHA of this workflow run." >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "APPLY_PRODUCTION_DATABASE" ]]; then
            echo "The production confirmation phrase does not match." >&2
            exit 1
          fi

  pre-migration-backup:
    name: Create encrypted pre-migration backup
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BACKUP_PREFIX: comppuzzles/pre-migration
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out the reviewed backup script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned backup clients
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          distribution_codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${distribution_codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Stream encrypted snapshot to private R2
        run: scripts/backup-postgres-to-r2.sh

  migrate:
    name: Dry-run and apply reviewed migrations
    needs: [validate-request, pre-migration-backup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this GitHub environment with required reviewers, main-only
    # deployment branches and no self-review before adding its secrets.
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.101.0

      - name: Validate protected environment
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PUBLISHABLE_KEY SUPABASE_PROJECT_ID SUPABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected production setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Link production project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Show migration state
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Verify migration state
        run: supabase migration list

      - name: Prove that hosted PostgREST exposes only the api schema
        run: |
          set -Eeuo pipefail
          if [[ ! "${SUPABASE_URL}" =~ ^https://[^/]+$ ]]; then
            echo "SUPABASE_URL must be an exact HTTPS origin." >&2
            exit 1
          fi
          public_status="$(curl --silent --show-error \
            --output /tmp/public-schema-response.json \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Accept-Profile: public' \
            "${SUPABASE_URL}/rest/v1/AccountProfile?select=authUserId&limit=1")"
          if [[ "${public_status}" != "406" ]] || ! grep --quiet 'PGRST106' /tmp/public-schema-response.json; then
            echo "Unsafe Data API configuration: the public schema is exposed." >&2
            exit 1
          fi
          api_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Accept-Profile: api' \
            "${SUPABASE_URL}/rest/v1/public_profiles?select=username&limit=1")"
          if [[ "${api_status}" != "200" ]]; then
            echo "The safe api schema is not reachable after migration." >&2
            exit 1
          fi

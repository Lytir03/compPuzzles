services:
  postgres:
    image: postgres:16-alpine
    container_name: comppuzzles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comppuzzles
      POSTGRES_PASSWORD: comppuzzles_dev_password
      POSTGRES_DB: comppuzzles
    ports:
      - "5432:5432"
    volumes:
      - comppuzzles_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comppuzzles -d comppuzzles"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  comppuzzles_pgdata:

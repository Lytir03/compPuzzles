project_id = "comppuzzles"

[api]
enabled = true
port = 55321
schemas = ["api"]
extra_search_path = ["api"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_expiry = 3600

[auth.rate_limit]
email_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[analytics]
enabled = false
